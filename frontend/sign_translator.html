<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignBridge — 실시간 수어 번역기</title>

  <!-- MediaPipe Hands: 웹캠에서 손 관절 21개 좌표를 뽑아주는 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    /* ── 디자인 토큰 ─────────────────────────── */
    :root {
      --bg:       #0D0F18;
      --surface:  #151824;
      --surface2: #1C2030;
      --line:     rgba(255,255,255,0.08);
      --text:     #EDEAF4;
      --sub:      #8B90A8;
      --accent:   #7B8FFF;
      --live:     #52C9A0;
      --danger:   #E06060;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ── 레이아웃 ─────────────────────────────── */
    .app { width: 100%; max-width: 440px; }

    /* ── 헤더 ────────────────────────────────── */
    .header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }
    .logo {
      display: flex; align-items: center; gap: 8px;
      font-size: 15px; font-weight: 600;
    }
    .status {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--sub);
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--sub); transition: background 0.3s;
    }
    .dot.live { background: var(--live); animation: breathe 2s ease-in-out infinite; }

    /* ── 카드 공통 ───────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    /* ── 그리드 (카메라 + 번역결과) ───────────── */
    .grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 12px;
    }

    /* ── 카메라 카드 ─────────────────────────── */
    .cam-card {
      aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    /* canvas: MediaPipe가 손 뼈대를 그려줄 레이어 */
    #cam-canvas {
      width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
      position: absolute; inset: 0;
    }
    #cam-video {
      width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
      display: none; /* MediaPipe가 쓰는 숨겨진 video 태그 */
    }
    .cam-off {
      font-size: 26px; color: var(--sub);
      display: flex; align-items: center; justify-content: center;
    }
    .cam-label {
      position: absolute; bottom: 7px; left: 9px;
      font-size: 10px; color: var(--sub); letter-spacing: 0.04em;
    }
    /* 손 인식 중일 때 테두리 강조 */
    .cam-card.detecting { border-color: var(--live); }

    /* ── 번역 결과 카드 ──────────────────────── */
    .result-card {
      padding: 14px;
      display: flex; flex-direction: column;
      justify-content: space-between; min-height: 140px;
    }
    .result-label {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--sub);
    }
    .result-word {
      font-size: 3rem; font-weight: 700;
      line-height: 1; letter-spacing: -0.03em;
      min-height: 3rem; transition: opacity 0.2s;
    }
    .result-ph { font-size: 13px; color: var(--sub); line-height: 1.5; }
    .confidence {
      font-size: 10px; color: var(--sub);
      letter-spacing: 0.04em; margin-top: 4px;
    }

    /* ── 음성 자막 카드 ──────────────────────── */
    .voice-card { padding: 14px; margin-bottom: 12px; }
    .voice-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 7px;
    }
    .voice-label {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--sub);
    }
    .live-tag {
      display: none; align-items: center;
      gap: 5px; font-size: 10px; color: var(--live);
    }
    .live-tag .ldot {
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--live); animation: breathe 1.5s ease-in-out infinite;
    }
    .voice-text { font-size: 15px; line-height: 1.6; color: var(--sub); min-height: 1.5em; }
    .voice-text.active { color: var(--text); }

    /* ── 컨트롤 바 ───────────────────────────── */
    .controls {
      background: var(--surface2);
      border: 1px solid var(--line);
      border-radius: 12px;
      display: flex; align-items: center;
      justify-content: space-around; padding: 10px 8px;
    }
    .ctrl-btn {
      background: none; border: none; cursor: pointer;
      padding: 9px; border-radius: 9px; color: var(--sub);
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s, background 0.15s; font-size: 19px;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.06); }
    .ctrl-btn.off { color: var(--danger); }
    .ctrl-btn.on  { color: var(--text); }

    /* WS 연결 버튼 */
    .connect-btn {
      display: flex; align-items: center; gap: 7px;
      background: var(--accent); color: #0D0F18;
      border: none; border-radius: 10px;
      padding: 10px 18px; font-size: 13px; font-weight: 700;
      cursor: pointer; font-family: inherit;
      transition: opacity 0.15s;
    }
    .connect-btn:hover { opacity: 0.88; }
    .connect-btn.connected {
      background: var(--live); color: #0D0F18;
    }
    .connect-btn.disconnected {
      background: var(--danger); color: #fff;
    }

    /* ── 애니메이션 ───────────────────────────── */
    @keyframes breathe {
      0%, 100% { opacity: 0.3; }
      50%       { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .dot.live, .ldot { animation: none; }
    }
  </style>
</head>
<body>
  <div class="app">

    <!-- 헤더 -->
    <div class="header">
      <div class="logo">🤟 SignBridge</div>
      <div class="status">
        <span class="dot" id="s-dot"></span>
        <span id="s-txt">대기 중</span>
      </div>
    </div>

    <!-- 카메라 + 번역 결과 -->
    <div class="grid">
      <!-- 카메라 (캔버스에 손 뼈대 오버레이) -->
      <div class="card cam-card" id="cam-card">
        <div class="cam-off" id="cam-off">📷</div>
        <!-- MediaPipe가 처리할 숨겨진 video 태그 -->
        <video id="cam-video" autoplay playsinline muted></video>
        <!-- MediaPipe가 손 뼈대를 그릴 캔버스 -->
        <canvas id="cam-canvas" style="display:none;"></canvas>
        <span class="cam-label">내 카메라</span>
      </div>

      <!-- 번역 결과 -->
      <div class="card result-card">
        <span class="result-label">번역 결과</span>
        <div>
          <p class="result-word" id="hero-word" style="display:none;"></p>
          <p class="result-ph" id="hero-ph">수어를 인식하면<br>여기에 표시돼요</p>
          <p class="confidence" id="conf-txt"></p>
        </div>
        <div id="buf-row" style="display:flex; gap:4px; flex-wrap:wrap; min-height:22px;">
          <span style="font-size:12px; color:var(--sub);">―</span>
        </div>
      </div>
    </div>

    <!-- 음성 자막 -->
    <div class="card voice-card">
      <div class="voice-header">
        <span class="voice-label">상대방 음성 자막</span>
        <span class="live-tag" id="live-tag">
          <span class="ldot"></span>듣는 중
        </span>
      </div>
      <p class="voice-text" id="voice-txt">―</p>
    </div>

    <!-- 컨트롤 바 -->
    <div class="controls">
      <!-- 마이크 토글 -->
      <button class="ctrl-btn on" id="btn-mic" onclick="toggleMic()" aria-label="마이크 끄기">
        🎙️
      </button>

      <!-- 카메라 + MediaPipe 시작 -->
      <button class="ctrl-btn off" id="btn-cam" onclick="toggleCam()" aria-label="카메라 켜기">
        📷
      </button>

      <!-- 백엔드 WebSocket 연결 -->
      <button class="connect-btn" id="btn-ws" onclick="toggleWS()">
        🔌 연결
      </button>

      <!-- TTS 음성 출력 토글 -->
      <button class="ctrl-btn on" id="btn-tts" onclick="toggleTts()" aria-label="음성 출력 끄기">
        🔊
      </button>

      <!-- 음성 인식 토글 -->
      <button class="ctrl-btn" id="btn-listen" onclick="toggleListen()" aria-label="음성 인식 시작">
        👂
      </button>
    </div>
  </div>

  <!-- ──────────────────────────────────────────
       JavaScript
       ────────────────────────────────────────── -->
  <script>
  // ── 상태 변수 ──────────────────────────────
  var micOn    = true;
  var camOn    = false;
  var ttsOn    = true;
  var listening = false;
  var wsConnected = false;

  var mediaStream  = null;  // 웹캠 스트림
  var mpCamera     = null;  // MediaPipe Camera 객체
  var mpHands      = null;  // MediaPipe Hands 객체
  var ws           = null;  // WebSocket 연결
  var recognition  = null;  // 음성인식 객체

  // 번역 결과 누적
  var lastText     = '';
  var history      = [];

  // ── 백엔드 WebSocket 주소 ───────────────────
  var WS_URL = 'ws://127.0.0.1:8000/ws/sign';

  // ── WebSocket 연결/해제 토글 ────────────────
  function toggleWS() {
    if (wsConnected) {
      ws && ws.close();
      return;
    }
    ws = new WebSocket(WS_URL);

    ws.onopen = function() {
      wsConnected = true;
      setStatus('백엔드 연결됨', true);
      var btn = document.getElementById('btn-ws');
      btn.textContent = '✅ 연결됨';
      btn.className = 'connect-btn connected';
    };

    // 백엔드에서 번역 결과가 오면 화면에 표시
    ws.onmessage = function(e) {
      var data = JSON.parse(e.data);
      if (data.status === 'success' && data.translated_text) {
        showResult(data.translated_text, data.confidence);
      }
    };

    ws.onclose = function() {
      wsConnected = false;
      setStatus('연결 끊김', false);
      var btn = document.getElementById('btn-ws');
      btn.textContent = '🔌 연결';
      btn.className = 'connect-btn disconnected';
    };

    ws.onerror = function() {
      setStatus('연결 오류', false);
    };
  }

  // ── 번역 결과 표시 ─────────────────────────
  function showResult(text, confidence) {
    // 같은 글자가 계속 들어오면 무시 (끊어읽기 기초)
    if (text === lastText) return;
    lastText = text;

    document.getElementById('hero-ph').style.display = 'none';
    var hw = document.getElementById('hero-word');
    hw.textContent = text;
    hw.style.display = 'block';

    // 신뢰도 표시
    if (confidence) {
      document.getElementById('conf-txt').textContent =
        '신뢰도: ' + Math.round(confidence * 100) + '%';
    }

    // TTS 음성 출력
    speakOut(text);
  }

  // ── MediaPipe Hands 초기화 ─────────────────
  // 웹캠 프레임마다 손 관절 21개 좌표(landmarks)를 뽑아줌
  function initMediaPipe(videoEl, canvasEl) {
    mpHands = new Hands({
      locateFile: function(file) {
        return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + file;
      }
    });

    mpHands.setOptions({
      maxNumHands: 1,          // 한 손만 인식
      modelComplexity: 1,      // 0: 빠름/낮음, 1: 느림/높음
      minDetectionConfidence: 0.7,
      minTrackingConfidence: 0.5,
    });

    // 손이 인식될 때마다 이 함수가 실행됨
    mpHands.onResults(function(results) {
      var ctx = canvasEl.getContext('2d');
      canvasEl.width  = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;

      // 비디오 프레임을 캔버스에 그림
      ctx.save();
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);

      var camCard = document.getElementById('cam-card');

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        var landmarks = results.multiHandLandmarks[0];

        // 손 뼈대 시각화 (MediaPipe drawing utils)
        drawConnectors(ctx, landmarks, HAND_CONNECTIONS, { color: '#7B8FFF', lineWidth: 2 });
        drawLandmarks(ctx,  landmarks, { color: '#52C9A0', lineWidth: 1, radius: 3 });

        camCard.classList.add('detecting');

        // WebSocket이 연결돼 있으면 landmarks를 백엔드로 전송
        if (ws && ws.readyState === WebSocket.OPEN) {
          // landmarks: [{x, y, z}, ...] 형태의 21개 좌표 배열
          var lmData = landmarks.map(function(lm) {
            return { x: lm.x, y: lm.y, z: lm.z };
          });
          ws.send(JSON.stringify({ landmarks: lmData }));
        }

      } else {
        camCard.classList.remove('detecting');
        lastText = ''; // 손이 안 보이면 끊어읽기 리셋
      }

      ctx.restore();
    });

    // MediaPipe Camera: 매 프레임마다 Hands 모델에 이미지 공급
    mpCamera = new Camera(videoEl, {
      onFrame: async function() {
        await mpHands.send({ image: videoEl });
      },
      width: 640,
      height: 480,
    });

    mpCamera.start();
  }

  // ── 카메라 토글 ────────────────────────────
  function toggleCam() {
    if (camOn) {
      // 카메라 끄기
      mpCamera && mpCamera.stop();
      mediaStream && mediaStream.getTracks().forEach(function(t) { t.stop(); });
      mediaStream = null;
      camOn = false;

      document.getElementById('cam-canvas').style.display = 'none';
      document.getElementById('cam-off').style.display    = 'flex';
      var btn = document.getElementById('btn-cam');
      btn.className = 'ctrl-btn off';
      return;
    }

    // 카메라 켜기
    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(function(s) {
        mediaStream = s;
        var v = document.getElementById('cam-video');
        var c = document.getElementById('cam-canvas');
        v.srcObject = s;
        v.onloadedmetadata = function() {
          c.style.display = 'block';
          document.getElementById('cam-off').style.display = 'none';
          camOn = true;
          var btn = document.getElementById('btn-cam');
          btn.className = 'ctrl-btn on';

          // MediaPipe 초기화
          initMediaPipe(v, c);
        };
      })
      .catch(function() {
        setStatus('카메라 권한 필요', false);
      });
  }

  // ── 마이크 토글 ────────────────────────────
  function toggleMic() {
    micOn = !micOn;
    if (mediaStream) {
      mediaStream.getAudioTracks().forEach(function(t) { t.enabled = micOn; });
    }
    var btn = document.getElementById('btn-mic');
    btn.textContent  = micOn ? '🎙️' : '🔇';
    btn.className    = micOn ? 'ctrl-btn on' : 'ctrl-btn off';
  }

  // ── TTS 토글 ───────────────────────────────
  function toggleTts() {
    ttsOn = !ttsOn;
    var btn = document.getElementById('btn-tts');
    btn.textContent = ttsOn ? '🔊' : '🔇';
    btn.className   = ttsOn ? 'ctrl-btn on' : 'ctrl-btn off';
  }

  // ── 음성 인식 토글 (청인 측 자막) ──────────
  function toggleListen() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      document.getElementById('voice-txt').textContent = '이 브라우저는 음성 인식 미지원 (크롬 권장)';
      return;
    }
    if (listening) {
      recognition && recognition.stop();
      listening = false;
      document.getElementById('live-tag').style.display  = 'none';
      document.getElementById('btn-listen').className    = 'ctrl-btn';
      return;
    }
    recognition = new SR();
    recognition.lang            = 'ko-KR';
    recognition.continuous      = true;
    recognition.interimResults  = true;

    recognition.onresult = function(e) {
      var txt = '';
      for (var i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      var el = document.getElementById('voice-txt');
      el.textContent = txt || '―';
      el.className   = txt ? 'voice-text active' : 'voice-text';
    };
    recognition.onend = function() {
      listening = false;
      document.getElementById('live-tag').style.display = 'none';
    };
    recognition.start();
    listening = true;
    document.getElementById('live-tag').style.display  = 'flex';
    document.getElementById('btn-listen').className    = 'ctrl-btn on';
  }

  // ── TTS 음성 출력 ──────────────────────────
  // 번역 결과를 브라우저 내장 음성으로 읽어줌 (서버 불필요)
  function speakOut(text) {
    if (!ttsOn || !window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.speak(u);
  }

  // ── 상태 표시 ──────────────────────────────
  function setStatus(label, active) {
    document.getElementById('s-txt').textContent = label;
    var dot = document.getElementById('s-dot');
    dot.className = active ? 'dot live' : 'dot';
  }
  </script>
</body>
</html>
