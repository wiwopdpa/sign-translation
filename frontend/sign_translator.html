<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SignBridge - 실시간 양방향 수어 번역 시스템</title>
    <!-- MediaPipe & Camera 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- Pretendard 폰트 -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: rgba(22, 27, 34, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --accent-blue: #2f81f7;
            --accent-green: #2ea043;
            --accent-purple: #8957e5;
            --text-main: #f0f6fc;
            --text-sub: #8b949e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(47, 129, 247, 0.12) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(137, 87, 229, 0.12) 0px, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 40%, #79c0ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        header p {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-top: 6px;
        }

        .main-container {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            width: 100%;
            max-width: 1100px;
        }

        /* 왼쪽: 비디오 및 카메라 영역 */
        .video-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .video-card {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background: #000;
            border-radius: 18px;
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        video { display: none; }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
        }

        .status-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(13, 17, 23, 0.8);
            backdrop-filter: blur(8px);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid var(--card-border);
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #f85149;
        }

        .dot.active {
            background-color: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px 18px;
            font-size: 0.95rem;
            font-weight: 700;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            cursor: pointer;
            background: var(--card-bg);
            color: var(--text-main);
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        button:hover {
            border-color: rgba(255, 255, 255, 0.3);
            background: rgba(48, 54, 61, 0.8);
            transform: translateY(-2px);
        }

        button.primary {
            background: linear-gradient(135deg, var(--accent-blue) 0%, #1f6feb 100%);
            border: none;
        }

        /* 오른쪽: 양방향 번역 패널 */
        .translation-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .panel-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-sub);
        }

        .badge {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .badge-blue {
            background: rgba(47, 129, 247, 0.15);
            color: #58a6ff;
            border: 1px solid rgba(47, 129, 247, 0.3);
        }

        .badge-purple {
            background: rgba(137, 87, 229, 0.15);
            color: #bc8cff;
            border: 1px solid rgba(137, 87, 229, 0.3);
        }

        /* 실시간 수어 번역 단어 표시 */
        .current-word {
            font-size: 2.2rem;
            font-weight: 800;
            color: #3fb950;
            min-height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
        }

        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-green));
            border-radius: 10px;
            transition: width 0.2s ease-out;
        }

        /* 문장 완성 버퍼 */
        .sentence-box {
            min-height: 60px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            font-size: 1.05rem;
            line-height: 1.4;
            color: #e6edf3;
            border: 1px solid rgba(255, 255, 255, 0.05);
            word-break: break-all;
        }

        /* 음성인식 자막 박스 */
        .stt-box {
            min-height: 70px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 12px;
            font-size: 1.05rem;
            color: #bc8cff;
            border: 1px dashed rgba(137, 87, 229, 0.4);
            display: flex;
            align-items: center;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            color: var(--text-sub);
            cursor: pointer;
        }

        @media (max-width: 850px) {
            .main-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🤟 SignBridge</h1>
        <p>실시간 양방향 수어·음성 통역 웹 서비스 (Sign $\leftrightarrow$ Voice)</p>
    </header>

    <div class="main-container">
        <!-- 왼쪽: 카메라 및 비디오 제어 -->
        <div class="video-section">
            <div class="video-card">
                <video id="webcam" playsinline></video>
                <canvas id="output-canvas" width="640" height="480"></canvas>
                <div class="status-badge">
                    <span class="dot" id="server-dot"></span>
                    <span id="server-status">백엔드 대기 중</span>
                </div>
            </div>
            <div class="button-group">
                <button class="primary" onclick="startCamera()">📷 카메라 시작</button>
                <button onclick="connectWebSocket()">🔌 백엔드 연결</button>
                <button onclick="toggleSpeechRecognition()" id="btn-stt">🎤 청인 음성듣기 OFF</button>
            </div>
        </div>

        <!-- 오른쪽: 양방향 번역 결과 패널 -->
        <div class="translation-panel">
            <!-- 1. 수어 -> 텍스트/음성 (농인 -> 청인) -->
            <div class="panel-card">
                <div class="card-header">
                    <span class="card-title">수어 실시간 인식</span>
                    <label class="toggle-label">
                        <input type="checkbox" id="tts-toggle" checked> TTS 자동 음성출력
                    </label>
                </div>
                <div class="current-word" id="current-word">대기 중...</div>
                <div class="progress-track">
                    <div class="progress-fill" id="confidence-bar"></div>
                </div>
                <div class="card-header" style="margin-top: 8px;">
                    <span class="card-title">조합된 문장</span>
                    <button style="flex:0; padding: 4px 10px; font-size: 0.75rem;" onclick="clearSentence()">초기화</button>
                </div>
                <div class="sentence-box" id="sentence-box">인식된 수어가 여기에 누적됩니다.</div>
            </div>

            <!-- 2. 음성 -> 자막 (청인 -> 농인) -->
            <div class="panel-card">
                <div class="card-header">
                    <span class="card-title">청인 음성 자막 (STT)</span>
                    <span class="badge badge-purple" id="stt-status">마이크 대기</span>
                </div>
                <div class="stt-box" id="stt-output">비장애인이 마이크로 말하면 실시간 자막으로 표시됩니다.</div>
            </div>
        </div>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('output-canvas');
        const canvasCtx = canvasElement.getContext('2d');
        const currentWordEl = document.getElementById('current-word');
        const confidenceBar = document.getElementById('confidence-bar');
        const sentenceBox = document.getElementById('sentence-box');
        const serverStatus = document.getElementById('server-status');
        const serverDot = document.getElementById('server-dot');
        const ttsToggle = document.getElementById('tts-toggle');
        const sttOutput = document.getElementById('stt-output');
        const sttStatus = document.getElementById('stt-status');
        const btnStt = document.getElementById('btn-stt');

        let websocket = null;
        let camera = null;
        let accumulatedSentence = [];
        let lastRecognizedWord = "";
        let lastRecognizedTime = 0;
        let recognition = null;
        let isSttListening = false;

        // 1. WebSocket 연결
        function connectWebSocket() {
            if (websocket && (websocket.readyState === WebSocket.OPEN || websocket.readyState === WebSocket.CONNECTING)) {
                return;
            }

            serverStatus.innerText = "연결 시도 중...";
            serverDot.className = "dot";

            websocket = new WebSocket("ws://127.0.0.1:8000/ws");

            websocket.onopen = () => {
                serverStatus.innerText = "백엔드 연결됨";
                serverDot.className = "dot active";
            };

            websocket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.status === "success" && data.word) {
                    handleSignResult(data.word, data.confidence);
                }
            };

            websocket.onclose = () => {
                serverStatus.innerText = "연결 끊김";
                serverDot.className = "dot";
            };

            websocket.onerror = () => {
                serverStatus.innerText = "연결 실패";
                serverDot.className = "dot";
            };
        }

        // 2. 수어 인식 결과 처리 및 끊어읽기(디바운싱) & TTS
        function handleSignResult(word, confidence) {
            currentWordEl.innerText = word;
            confidenceBar.style.width = `${Math.min(confidence, 100)}%`;

            const now = Date.now();
            // 동일 단어 중복 방지 (최소 1.5초 간격 또는 새로운 단어일 때만 추가)
            if (word !== lastRecognizedWord || (now - lastRecognizedTime > 1500)) {
                lastRecognizedWord = word;
                lastRecognizedTime = now;

                accumulatedSentence.push(word);
                sentenceBox.innerText = accumulatedSentence.join(" ");

                // SpeechSynthesis TTS 음성 출력
                if (ttsToggle.checked) {
                    speakText(word);
                }
            }
        }

        function speakText(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 이전 발화 중단
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ko-KR';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        function clearSentence() {
            accumulatedSentence = [];
            sentenceBox.innerText = "인식된 수어가 여기에 누적됩니다.";
            lastRecognizedWord = "";
        }

        // 3. Web Speech API (청인 음성 -> 자막 변환 STT)
        function toggleSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("현재 브라우저에서는 Web Speech API를 지원하지 않습니다. Chrome 브라우저를 권장합니다.");
                return;
            }

            if (!recognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'ko-KR';
                recognition.continuous = true;
                recognition.interimResults = true;

                recognition.onstart = () => {
                    isSttListening = true;
                    btnStt.innerText = "🎤 청인 음성듣기 ON";
                    btnStt.style.background = "#8957e5";
                    sttStatus.innerText = "음성 청취 중...";
                };

                recognition.onresult = (event) => {
                    let transcript = "";
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    sttOutput.innerText = transcript;
                };

                recognition.onerror = (e) => {
                    console.error("STT 에러:", e);
                };

                recognition.onend = () => {
                    if (isSttListening) recognition.start();
                };
            }

            if (isSttListening) {
                isSttListening = false;
                recognition.stop();
                btnStt.innerText = "🎤 청인 음성듣기 OFF";
                btnStt.style.background = "";
                sttStatus.innerText = "마이크 대기";
            } else {
                recognition.start();
            }
        }

        // 4. MediaPipe Hands 파이프라인
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            let lh = new Array(63).fill(0.0);
            let rh = new Array(63).fill(0.0);

            if (results.multiHandLandmarks && results.multiHandedness) {
                for (let i = 0; i < results.multiHandLandmarks.length; i++) {
                    const landmarks = results.multiHandLandmarks[i];
                    const label = results.multiHandedness[i].label;
                    
                    drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#2f81f7', lineWidth: 3});
                    drawLandmarks(canvasCtx, landmarks, {color: '#2ea043', lineWidth: 1.5, radius: 3});

                    const coords = [];
                    for (let lm of landmarks) {
                        coords.push(lm.x, lm.y, lm.z);
                    }

                    if (label === 'Left') {
                        lh = coords;
                    } else if (label === 'Right') {
                        rh = coords;
                    }
                }
            }
            canvasCtx.restore();

            const keypoints126 = lh.concat(rh);
            if (websocket && websocket.readyState === WebSocket.OPEN) {
                websocket.send(JSON.stringify({ landmarks: keypoints126 }));
            }
        });

        // 5. 카메라 시작
        function startCamera() {
            if (camera) return;

            camera = new Camera(videoElement, {
                onFrame: async () => {
                    await hands.send({ image: videoElement });
                },
                width: 640,
                height: 480
            });
            camera.start();
        }
    </script>
</body>
</html>
