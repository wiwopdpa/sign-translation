<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignBridge</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg:      #0D0F18;
      --surface: #151824;
      --line:    rgba(255,255,255,0.08);
      --text:    #EDEAF4;
      --sub:     #8B90A8;
      --accent:  #7B8FFF;
      --live:    #52C9A0;
      --danger:  #E06060;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .app { width: 100%; max-width: 440px; }

    /* 헤더 */
    .header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 1.75rem;
    }
    .logo { font-size: 16px; font-weight: 700; }

    /* 카드 */
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
    }

    /* 카메라 + 번역결과 그리드 */
    .grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 12px;
    }
    .cam-card {
      aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    #cam-canvas {
      width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
      position: absolute; inset: 0; display: none;
    }
    #cam-video {
      display: none;
    }
    .cam-placeholder {
      display: flex; flex-direction: column;
      align-items: center; gap: 8px;
      color: var(--sub); font-size: 13px;
    }
    .cam-placeholder span { font-size: 28px; }

    /* 번역결과 */
    .result-card {
      padding: 14px;
      display: flex; flex-direction: column;
      justify-content: space-between; min-height: 140px;
    }
    .result-label {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--sub);
    }
    .result-word {
      font-size: 2.8rem; font-weight: 700;
      line-height: 1; letter-spacing: -0.03em;
      min-height: 2.8rem;
    }
    .result-ph { font-size: 13px; color: var(--sub); line-height: 1.5; }

    /* 음성 자막 */
    .voice-card { padding: 14px; margin-bottom: 12px; }
    .voice-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 7px;
    }
    .voice-label {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--sub);
    }
    .rec-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--danger);
      animation: blink 1.2s ease-in-out infinite;
      display: none;
    }
    @keyframes blink { 0%,100%{opacity:0.3;} 50%{opacity:1;} }
    .voice-text { font-size: 15px; line-height: 1.6; color: var(--sub); min-height: 1.5em; }
    .voice-text.active { color: var(--text); }

    /* 컨트롤 */
    .controls {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      display: flex; align-items: center;
      justify-content: space-around; padding: 10px 8px;
    }
    .ctrl-btn {
      background: none; border: none; cursor: pointer;
      padding: 10px; border-radius: 10px;
      display: flex; flex-direction: column;
      align-items: center; gap: 4px;
      transition: background 0.15s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.06); }
    .ctrl-icon { font-size: 20px; }
    .ctrl-label { font-size: 9px; color: var(--sub); letter-spacing: 0.04em; }
    .ctrl-btn.off .ctrl-icon { filter: grayscale(1) opacity(0.4); }

    /* 손 감지 중 테두리 */
    .cam-card.detecting { border-color: var(--live); }

    @media (prefers-reduced-motion: reduce) { .rec-dot { animation: none; } }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="logo">🤟 SignBridge</div>
  </div>

  <div class="grid">
    <!-- 카메라 -->
    <div class="card cam-card" id="cam-card">
      <div class="cam-placeholder" id="cam-ph">
        <span>📷</span>
        <p>카메라 켜기</p>
      </div>
      <video id="cam-video" autoplay playsinline muted></video>
      <canvas id="cam-canvas"></canvas>
    </div>

    <!-- 번역 결과 -->
    <div class="card result-card">
      <span class="result-label">번역 결과</span>
      <div>
        <p class="result-word" id="result-word" style="display:none;"></p>
        <p class="result-ph" id="result-ph">수어를 인식하면<br>여기에 표시돼요</p>
      </div>
      <div style="height:4px;"></div>
    </div>
  </div>

  <!-- 음성 자막 -->
  <div class="card voice-card">
    <div class="voice-header">
      <span class="voice-label">상대방 음성 자막</span>
      <span class="rec-dot" id="rec-dot"></span>
    </div>
    <p class="voice-text" id="voice-txt">―</p>
  </div>

  <!-- 컨트롤 -->
  <div class="controls">
    <button class="ctrl-btn on" id="btn-cam" onclick="toggleCam()">
      <span class="ctrl-icon">📷</span>
      <span class="ctrl-label">카메라</span>
    </button>
    <button class="ctrl-btn on" id="btn-mic" onclick="toggleMic()">
      <span class="ctrl-icon">🎙️</span>
      <span class="ctrl-label">마이크</span>
    </button>
    <button class="ctrl-btn on" id="btn-tts" onclick="toggleTts()">
      <span class="ctrl-icon">🔊</span>
      <span class="ctrl-label">음성출력</span>
    </button>
    <button class="ctrl-btn" id="btn-listen" onclick="toggleListen()">
      <span class="ctrl-icon">👂</span>
      <span class="ctrl-label">음성인식</span>
    </button>
  </div>

</div>

<script>
// ── 상태 ────────────────────────────────────────
var camOn = false, micOn = true, ttsOn = true, listening = false;
var mediaStream = null, mpCamera = null, mpHands = null;
var ws = null, wsReady = false;
var recognition = null;
var lastText = '';

var WS_URL = 'ws://127.0.0.1:8000/ws';

// ── WebSocket 자동 연결 (사용자에게 안 보임) ────
function connectWS() {
  try {
    ws = new WebSocket(WS_URL);
    ws.onopen = function() { wsReady = true; };
    ws.onmessage = function(e) {
      var data = JSON.parse(e.data);
      if (data.status === 'success' && data.word && data.text !== lastText) {
        lastText = data.text;
        showResult(data.text);
        speakOut(data.text);
      }
    };
    ws.onclose = function() {
      wsReady = false;
      // 3초 뒤 자동 재연결 시도
      setTimeout(connectWS, 3000);
    };
    ws.onerror = function() { wsReady = false; };
  } catch(e) {}
}

// ── 번역 결과 표시 ─────────────────────────────
function showResult(text) {
  document.getElementById('result-ph').style.display = 'none';
  var w = document.getElementById('result-word');
  w.textContent = text;
  w.style.display = 'block';
}

// ── 카메라 + MediaPipe 시작 ────────────────────
function startCam() {
  navigator.mediaDevices.getUserMedia({ video: true, audio: false })
    .then(function(s) {
      mediaStream = s;
      var v = document.getElementById('cam-video');
      var c = document.getElementById('cam-canvas');
      v.srcObject = s;
      v.onloadedmetadata = function() {
        document.getElementById('cam-ph').style.display = 'none';
        c.style.display = 'block';
        camOn = true;
        document.getElementById('btn-cam').className = 'ctrl-btn on';

        // MediaPipe Hands 초기화
        mpHands = new Hands({
          locateFile: function(f) {
            return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + f;
          }
        });
        mpHands.setOptions({
          maxNumHands: 2,          // 양손 인식
          modelComplexity: 1,
          minDetectionConfidence: 0.7,
          minTrackingConfidence: 0.5,
        });
        mpHands.onResults(onHandResults);

        // 카메라 루프 시작
        mpCamera = new Camera(v, {
          onFrame: async function() {
            await mpHands.send({ image: v });
          },
          width: 640, height: 480,
        });
        mpCamera.start();
      };
    })
    .catch(function() {
      document.getElementById('cam-ph').innerHTML = '<span>🚫</span><p>카메라 권한이 필요해요</p>';
    });
}

// ── MediaPipe 결과 처리 ─────────────────────────
function onHandResults(results) {
  var canvas = document.getElementById('cam-canvas');
  var video  = document.getElementById('cam-video');
  var ctx    = canvas.getContext('2d');
  var card   = document.getElementById('cam-card');

  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    // 양손 landmarks 합치기 (왼손 63 + 오른손 63 = 126차원)
    var leftLm  = null;
    var rightLm = null;

    for (var h = 0; h < results.multiHandLandmarks.length; h++) {
      var handedness = results.multiHandedness[h].label; // 'Left' or 'Right'
      if (handedness === 'Left')  leftLm  = results.multiHandLandmarks[h];
      if (handedness === 'Right') rightLm = results.multiHandLandmarks[h];
    }

    // 없는 손은 0으로 채움
    var emptyHand = Array(21).fill({ x: 0, y: 0, z: 0 });
    var leftData  = (leftLm  || emptyHand).map(function(p) { return { x: p.x, y: p.y, z: p.z }; });
    var rightData = (rightLm || emptyHand).map(function(p) { return { x: p.x, y: p.y, z: p.z }; });
    var combined  = leftData.concat(rightData); // 126개

    // 손 뼈대 시각화
    results.multiHandLandmarks.forEach(function(lm) {
      drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: '#7B8FFF', lineWidth: 2 });
      drawLandmarks(ctx,  lm, { color: '#52C9A0', lineWidth: 1, radius: 3 });
    });

    card.classList.add('detecting');

    // WebSocket으로 126개 landmarks 전송
    if (wsReady && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ landmarks: combined }));
    }
  } else {
    card.classList.remove('detecting');
    lastText = '';
  }
  ctx.restore();
}

// ── 카메라 토글 ────────────────────────────────
function toggleCam() {
  if (!camOn) { startCam(); return; }
  camOn = false;
  mpCamera && mpCamera.stop();
  mediaStream && mediaStream.getTracks().forEach(function(t) { t.stop(); });
  mediaStream = null;
  document.getElementById('cam-canvas').style.display = 'none';
  document.getElementById('cam-ph').style.display = 'flex';
  document.getElementById('cam-ph').innerHTML = '<span>📷</span><p>카메라 켜기</p>';
  document.getElementById('btn-cam').className = 'ctrl-btn off';
}

// ── 마이크 토글 ────────────────────────────────
function toggleMic() {
  micOn = !micOn;
  if (mediaStream) {
    mediaStream.getAudioTracks().forEach(function(t) { t.enabled = micOn; });
  }
  var btn = document.getElementById('btn-mic');
  btn.querySelector('.ctrl-icon').textContent = micOn ? '🎙️' : '🔇';
  btn.className = micOn ? 'ctrl-btn on' : 'ctrl-btn off';
}

// ── TTS 토글 ───────────────────────────────────
function toggleTts() {
  ttsOn = !ttsOn;
  var btn = document.getElementById('btn-tts');
  btn.querySelector('.ctrl-icon').textContent = ttsOn ? '🔊' : '🔇';
  btn.className = ttsOn ? 'ctrl-btn on' : 'ctrl-btn off';
}

// ── 음성 인식 토글 ─────────────────────────────
function toggleListen() {
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return;
  if (listening) {
    recognition && recognition.stop();
    listening = false;
    document.getElementById('rec-dot').style.display = 'none';
    document.getElementById('btn-listen').className = 'ctrl-btn';
    return;
  }
  recognition = new SR();
  recognition.lang = 'ko-KR';
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = function(e) {
    var txt = '';
    for (var i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
    var el = document.getElementById('voice-txt');
    el.textContent = txt || '―';
    el.className = txt ? 'voice-text active' : 'voice-text';
  };
  recognition.onend = function() {
    listening = false;
    document.getElementById('rec-dot').style.display = 'none';
    document.getElementById('btn-listen').className = 'ctrl-btn';
  };
  recognition.start();
  listening = true;
  document.getElementById('rec-dot').style.display = 'block';
  document.getElementById('btn-listen').className = 'ctrl-btn on';
}

// ── TTS 출력 ───────────────────────────────────
function speakOut(text) {
  if (!ttsOn || !window.speechSynthesis) return;
  var u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  window.speechSynthesis.speak(u);
}

// ── 초기 실행 ──────────────────────────────────
connectWS();  // 백엔드 자동 연결 (백그라운드)
startCam();   // 카메라 자동 시작
</script>
</body>
</html>
