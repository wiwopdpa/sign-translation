<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignBridge — 실시간 수어 번역기</title>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #0D0F18;
      --surface: #151824;
      --surface2: #1C2030;
      --line: rgba(255,255,255,0.08);
      --text: #EDEAF4;
      --sub: #8B90A8;
      --accent: #7B8FFF;
      --live: #52C9A0;
      --danger: #E06060;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* 화면 크기 대폭 확장 (최대 1100px) */
    .app { width: 100%; max-width: 1100px; }

    .header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }
    .logo {
      display: flex; align-items: center; gap: 10px;
      font-size: 20px; font-weight: 700;
    }
    .status {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--sub);
      letter-spacing: 0.06em; text-transform: uppercase;
    }
    .dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--sub); transition: background 0.3s;
    }
    .dot.live { background: var(--live); animation: breathe 2s ease-in-out infinite; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .grid {
      display: grid; 
      grid-template-columns: 1.3fr 1fr;
      gap: 20px; 
      margin-bottom: 20px;
    }

    /* 카메라 카드 확대 */
    .cam-card {
      min-height: 480px;
      aspect-ratio: 4/3;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
      border-radius: 16px;
    }
    #cam-canvas {
      width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
      position: absolute; inset: 0;
    }
    #cam-video {
      width: 100%; height: 100%;
      object-fit: cover; transform: scaleX(-1);
      display: none;
    }
    .cam-off {
      font-size: 48px; color: var(--sub);
      display: flex; align-items: center; justify-content: center;
    }
    .cam-label {
      position: absolute; bottom: 12px; left: 14px;
      font-size: 12px; color: var(--sub); letter-spacing: 0.04em;
      background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 6px;
    }
    .cam-card.detecting { border-color: var(--live); box-shadow: 0 0 15px rgba(82, 201, 160, 0.2); }

    /* 번역 결과 카드 */
    .result-card {
      padding: 24px;
      display: flex; flex-direction: column;
      justify-content: space-between;
      min-height: 480px;
    }
    .result-label {
      font-size: 13px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--sub);
    }
    .result-word {
      font-size: 4.5rem; font-weight: 800;
      line-height: 1.1; letter-spacing: -0.02em;
      color: var(--accent);
      min-height: 5rem;
    }
    .result-ph { font-size: 18px; color: var(--sub); line-height: 1.6; }
    .confidence {
      font-size: 14px; color: var(--live);
      letter-spacing: 0.04em; margin-top: 10px; font-weight: 600;
    }

    /* 음성 자막 카드 */
    .voice-card { padding: 18px 24px; margin-bottom: 20px; }
    .voice-header {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 10px;
    }
    .voice-label {
      font-size: 12px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--sub);
    }
    .live-tag {
      display: none; align-items: center;
      gap: 6px; font-size: 12px; color: var(--live);
    }
    .live-tag .ldot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--live); animation: breathe 1.5s ease-in-out infinite;
    }
    .voice-text { font-size: 17px; line-height: 1.6; color: var(--sub); min-height: 1.6em; }
    .voice-text.active { color: var(--text); }

    /* 컨트롤 바 */
    .controls {
      background: var(--surface2);
      border: 1px solid var(--line);
      border-radius: 14px;
      display: flex; align-items: center;
      justify-content: space-between; padding: 12px 20px;
    }
    .ctrl-group { display: flex; gap: 10px; align-items: center; }
    .ctrl-btn {
      background: var(--surface); border: 1px solid var(--line); cursor: pointer;
      padding: 12px 18px; border-radius: 10px; color: var(--sub);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 600; gap: 8px;
      transition: all 0.2s;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,0.08); color: var(--text); }
    .ctrl-btn.off { color: var(--danger); border-color: rgba(224, 96, 96, 0.3); }
    .ctrl-btn.on  { color: var(--live); border-color: rgba(82, 201, 160, 0.3); }

    .connect-btn {
      display: flex; align-items: center; gap: 8px;
      background: var(--accent); color: #0D0F18;
      border: none; border-radius: 10px;
      padding: 12px 24px; font-size: 15px; font-weight: 700;
      cursor: pointer; transition: opacity 0.15s;
    }
    .connect-btn:hover { opacity: 0.9; }
    .connect-btn.connected { background: var(--live); color: #0D0F18; }
    .connect-btn.disconnected { background: var(--danger); color: #fff; }

    @keyframes breathe {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="app">

    <div class="header">
      <div class="logo">🤟 SignBridge 실시간 수어 통역</div>
      <div class="status">
        <span class="dot" id="s-dot"></span>
        <span id="s-txt">대기 중</span>
      </div>
    </div>

    <div class="grid">
      <div class="card cam-card" id="cam-card">
        <div class="cam-off" id="cam-off">📷</div>
        <video id="cam-video" autoplay playsinline muted></video>
        <canvas id="cam-canvas" style="display:none;"></canvas>
        <span class="cam-label">웹캠 영상 (양손 인식)</span>
      </div>

      <div class="card result-card">
        <span class="result-label">실시간 수어 번역 결과</span>
        <div>
          <p class="result-word" id="hero-word" style="display:none;"></p>
          <p class="result-ph" id="hero-ph">카메라를 켜고 백엔드에 연결한 뒤<br>수어 동작을 진행해 주세요.</p>
          <p class="confidence" id="conf-txt"></p>
        </div>
        <div id="buf-row" style="display:flex; gap:6px; flex-wrap:wrap; min-height:24px;">
          <span style="font-size:13px; color:var(--sub);">누적 단어 히스토리 준비</span>
        </div>
      </div>
    </div>

    <div class="card voice-card">
      <div class="voice-header">
        <span class="voice-label">상대방 음성 자막 (STT)</span>
        <span class="live-tag" id="live-tag">
          <span class="ldot"></span>듣는 중
        </span>
      </div>
      <p class="voice-text" id="voice-txt">―</p>
    </div>

    <div class="controls">
      <div class="ctrl-group">
        <button class="ctrl-btn off" id="btn-cam" onclick="toggleCam()">📷 카메라 켜기</button>
        <button class="ctrl-btn on" id="btn-mic" onclick="toggleMic()">🎙️ 마이크 ON</button>
      </div>

      <button class="connect-btn" id="btn-ws" onclick="toggleWS()">🔌 백엔드 연결</button>

      <div class="ctrl-group">
        <button class="ctrl-btn on" id="btn-tts" onclick="toggleTts()">🔊 음성출력 ON</button>
        <button class="ctrl-btn" id="btn-listen" onclick="toggleListen()">👂 음성인식 시작</button>
      </div>
    </div>
  </div>

  <script>
  var camOn = false;
  var micOn = true;
  var ttsOn = true;
  var listening = false;
  var wsConnected = false;

  var mediaStream = null;
  var mpCamera = null;
  var mpHands = null;
  var ws = null;
  var recognition = null;
  var lastText = '';

  var WS_URL = 'ws://127.0.0.1:8000/ws/sign';

  function toggleWS() {
    if (wsConnected) {
      ws && ws.close();
      return;
    }
    ws = new WebSocket(WS_URL);

    ws.onopen = function() {
      wsConnected = true;
      setStatus('백엔드 연결됨', true);
      var btn = document.getElementById('btn-ws');
      btn.textContent = '✅ 연결 완료';
      btn.className = 'connect-btn connected';
    };

    ws.onmessage = function(e) {
      var data = JSON.parse(e.data);
      if (data.status === 'success' && data.text) {
        showResult(data.text, data.confidence);
      }
    };

    ws.onclose = function() {
      wsConnected = false;
      setStatus('연결 끊김', false);
      var btn = document.getElementById('btn-ws');
      btn.textContent = '🔌 백엔드 연결';
      btn.className = 'connect-btn disconnected';
    };

    ws.onerror = function() {
      setStatus('연결 오류', false);
    };
  }

  function showResult(text, confidence) {
    if (text === lastText) return;
    lastText = text;

    document.getElementById('hero-ph').style.display = 'none';
    var hw = document.getElementById('hero-word');
    hw.textContent = text;
    hw.style.display = 'block';

    if (confidence) {
      document.getElementById('conf-txt').textContent =
        '일치율: ' + Math.round(confidence * 100) + '%';
    }

    speakOut(text);
  }

  // 126차원(왼손 63 + 오른손 63) 플랫 배열 생성 함수
  function extractLandmarks126(results) {
    var lh = new Array(63).fill(0.0);
    var rh = new Array(63).fill(0.0);

    if (results.multiHandLandmarks && results.multiHandedness) {
      for (var i = 0; i < results.multiHandLandmarks.length; i++) {
        var classification = results.multiHandedness[i].label; // "Left" or "Right"
        var landmarks = results.multiHandLandmarks[i];
        var flatCoords = [];
        for (var j = 0; j < landmarks.length; j++) {
          flatCoords.push(landmarks[j].x, landmarks[j].y, landmarks[j].z);
        }

        if (classification === 'Left') {
          lh = flatCoords;
        } else if (classification === 'Right') {
          rh = flatCoords;
        }
      }
    }
    // [왼손(63), 오른손(63)] = 총 126차원 반환
    return lh.concat(rh);
  }

  function initMediaPipe(videoEl, canvasEl) {
    mpHands = new Hands({
      locateFile: function(file) {
        return 'https://cdn.jsdelivr.net/npm/@mediapipe/hands/' + file;
      }
    });

    mpHands.setOptions({
      maxNumHands: 2, // 양손 모두 인식
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.5,
    });

    mpHands.onResults(function(results) {
      var ctx = canvasEl.getContext('2d');
      canvasEl.width = videoEl.videoWidth;
      canvasEl.height = videoEl.videoHeight;

      ctx.save();
      ctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      ctx.drawImage(results.image, 0, 0, canvasEl.width, canvasEl.height);

      var camCard = document.getElementById('cam-card');

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (var i = 0; i < results.multiHandLandmarks.length; i++) {
          var lm = results.multiHandLandmarks[i];
          drawConnectors(ctx, lm, HAND_CONNECTIONS, { color: '#7B8FFF', lineWidth: 3 });
          drawLandmarks(ctx, lm, { color: '#52C9A0', lineWidth: 1, radius: 4 });
        }
        camCard.classList.add('detecting');
      } else {
        camCard.classList.remove('detecting');
      }
      ctx.restore();

      // 백엔드로 항상 126차원 1차원 float 배열 송신
      if (ws && ws.readyState === WebSocket.OPEN) {
        var frame126 = extractLandmarks126(results);
        ws.send(JSON.stringify({ landmarks: frame126 }));
      }
    });

    mpCamera = new Camera(videoEl, {
      onFrame: async function() {
        await mpHands.send({ image: videoEl });
      },
      width: 640,
      height: 480,
    });

    mpCamera.start();
  }

  function toggleCam() {
    var btn = document.getElementById('btn-cam');
    if (camOn) {
      mpCamera && mpCamera.stop();
      mediaStream && mediaStream.getTracks().forEach(function(t) { t.stop(); });
      mediaStream = null;
      camOn = false;

      document.getElementById('cam-canvas').style.display = 'none';
      document.getElementById('cam-off').style.display = 'flex';
      btn.textContent = '📷 카메라 켜기';
      btn.className = 'ctrl-btn off';
      return;
    }

    navigator.mediaDevices.getUserMedia({ video: true, audio: false })
      .then(function(s) {
        mediaStream = s;
        var v = document.getElementById('cam-video');
        var c = document.getElementById('cam-canvas');
        v.srcObject = s;
        v.onloadedmetadata = function() {
          c.style.display = 'block';
          document.getElementById('cam-off').style.display = 'none';
          camOn = true;
          btn.textContent = '📷 카메라 끄기';
          btn.className = 'ctrl-btn on';
          initMediaPipe(v, c);
        };
      })
      .catch(function(err) {
        console.error(err);
        setStatus('카메라 권한 오류', false);
      });
  }

  function toggleMic() {
    micOn = !micOn;
    var btn = document.getElementById('btn-mic');
    btn.textContent = micOn ? '🎙️ 마이크 ON' : '🔇 마이크 OFF';
    btn.className = micOn ? 'ctrl-btn on' : 'ctrl-btn off';
  }

  function toggleTts() {
    ttsOn = !ttsOn;
    var btn = document.getElementById('btn-tts');
    btn.textContent = ttsOn ? '🔊 음성출력 ON' : '🔇 음성출력 OFF';
    btn.className = ttsOn ? 'ctrl-btn on' : 'ctrl-btn off';
  }

  function toggleListen() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      document.getElementById('voice-txt').textContent = '이 브라우저는 음성 인식을 지원하지 않습니다. (크롬 권장)';
      return;
    }
    var btn = document.getElementById('btn-listen');
    if (listening) {
      recognition && recognition.stop();
      listening = false;
      document.getElementById('live-tag').style.display = 'none';
      btn.textContent = '👂 음성인식 시작';
      btn.className = 'ctrl-btn';
      return;
    }
    recognition = new SR();
    recognition.lang = 'ko-KR';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = function(e) {
      var txt = '';
      for (var i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript;
      var el = document.getElementById('voice-txt');
      el.textContent = txt || '―';
      el.className = txt ? 'voice-text active' : 'voice-text';
    };
    recognition.onend = function() {
      listening = false;
      document.getElementById('live-tag').style.display = 'none';
      btn.textContent = '👂 음성인식 시작';
      btn.className = 'ctrl-btn';
    };
    recognition.start();
    listening = true;
    document.getElementById('live-tag').style.display = 'flex';
    btn.textContent = '👂 인식 중...';
    btn.className = 'ctrl-btn on';
  }

  function speakOut(text) {
    if (!ttsOn || !window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    window.speechSynthesis.speak(u);
  }

  function setStatus(label, active) {
    document.getElementById('s-txt').textContent = label;
    var dot = document.getElementById('s-dot');
    dot.className = active ? 'dot live' : 'dot';
  }
  </script>
</body>
</html>
